name: Arduino Build & Deploy

on:
  workflow_call:
    inputs:
      environment:  { required: true,  type: string }
      serial_port:  { required: false, type: string, default: '' }
      device_name:  { required: true,  type: string }
      source_dir:   { required: true,  type: string }

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: [self-hosted, iot]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: true

      - name: Initialize Arduino CLI
        run: |
          & "$Env:RUNNER_TOOL_CACHE\arduino-cli\arduino-cli.exe" --config-file "$Env:RUNNER_TOOL_CACHE\arduino-cli\config.yaml" core update-index

      - uses: Zefek/GithubActions/Actions/deployConfig@v1
        with:
          repo:   ${{ vars.REPO }}
          auth:   ${{ secrets.REPO_TOKEN }}
          dest:   ${{ runner.temp }}\secrets
          device: ${{ inputs.device_name }}
          outdir: ${{ inputs.source_dir }}

      - name: Compile Arduino project (and upload when port is set)
        env:
          SERIAL_PORT: ${{ inputs.serial_port }}
        run: |
          $cli = "$Env:RUNNER_TOOL_CACHE\arduino-cli\arduino-cli.exe"
          $cliArgs = @(
            '--config-file', "$Env:RUNNER_TOOL_CACHE\arduino-cli\config.yaml"
            'compile', '${{ inputs.source_dir }}'
            '--build-property', "compiler.cpp.extra_flags=-DFW_VERSION=${{ github.run_number }}"
          )
          if ($env:SERIAL_PORT) { $cliArgs += @('--upload', '--port', $env:SERIAL_PORT) }
          & $cli @cliArgs
